# Added for the ERA RINF frontend, 2026-10-29. Licensed under the EUPL 1.2.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Runtime config: never cache, so edits apply on the next page load.
    location = /bootstrap.json {
        add_header Cache-Control "no-store";
    }

    # Hashed build files never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: deep links (/section-of-line/…, /rinf-reports) load index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
