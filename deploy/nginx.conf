# Added for the ERA RINF frontend, 2026-10-29. Licensed under the EUPL 1.2.
# Modified 2026-10-30: /era/ goes to the location code register (Tiamat).
# Modified 2026-11-01: /auth/ goes to the login service (Keycloak).

# Behind tailscale serve the browser's https arrives here as http; keep the
# scheme the proxy in front reports, so Keycloak knows the login is secure.
map $http_x_forwarded_proto $original_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # The location code register, at the app's own address (no CORS, and only
    # Tiamat's /era/ API is reachable, not the rest of Tiamat). The name is
    # looked up per request through Docker's DNS, so this server also starts
    # when Tiamat isn't running (requests then get 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /era/ {
        set $tiamat http://tiamat:8777;
        proxy_pass $tiamat;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_proto;
        proxy_read_timeout 120s;
        # Restoring a backup posts the whole register.
        client_max_body_size 50m;
        add_header Cache-Control "no-store" always;
    }

    # The login service. Its pages and tokens carry large cookies and headers.
    location /auth/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_proto;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Runtime config: never cache, so edits apply on the next page load.
    location = /bootstrap.json {
        add_header Cache-Control "no-store";
    }

    # Hashed build files never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: deep links (/section-of-line/…, /rinf-reports) load index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
